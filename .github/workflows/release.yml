name: Build Release Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: prologfmt-linux
          - os: macos-latest
            artifact_name: prologfmt-macos
          - os: windows-latest
            artifact_name: prologfmt-windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SWI-Prolog (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-add-repository ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install swi-prolog

      - name: Install SWI-Prolog (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install swi-prolog

      - name: Install SWI-Prolog (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install swi-prolog -y
          echo "C:\Program Files\swipl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Binary
        shell: bash
        run: swipl -O -q -o ${{ matrix.artifact_name }} -g main -c prologfmt.pl

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}